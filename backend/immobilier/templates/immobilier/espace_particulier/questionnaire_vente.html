{% extends 'immobilier/base.html' %}
{% load widget_tweaks %}

{% block title %}Questionnaire Vente Immobilière{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="form-container bg-white rounded shadow-sm p-4">
        <form method="post" class="needs-validation" novalidate>
            {% csrf_token %}
            <input type="hidden" name="type_projet" value="vente">
            
            <div class="text-center mb-4">
                <h2 class="h4 mb-2">Votre projet de vente immobilière</h2>
                <p class="text-muted" id="question-progress-text">
                    Question <span id="current-question">1</span>/<span id="total-questions">0</span>
                </p>
                <div class="progress mb-4">
                    <div class="progress-bar" role="progressbar" style="width: 0%" id="progress-bar"></div>
                </div>
                
                <div id="question-container">
                    <h3 class="h5 mb-4" id="question-text">Chargement de la question...</h3>
                    <div id="options-container" class="mb-4">
                        <!-- Les options seront insérées ici par JavaScript -->
                    </div>
                </div>
                
                <div class="d-flex justify-content-between mt-4">
                    <button type="button" class="btn btn-outline-secondary" id="prev-btn">
                        <i class="fas fa-arrow-left me-2"></i>Précédent
                    </button>
                    <button type="button" class="btn btn-primary" id="next-btn">
                        Suivant<i class="fas fa-arrow-right ms-2"></i>
                    </button>
                    <button type="submit" class="btn btn-success" id="submit-btn" style="display: none;">
                        <i class="fas fa-check me-2"></i>Terminer
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
