<style>
    /* Style ultra compact */
    body {
        background-color: #f8f9fa;
        padding: 0;
        font-size: 0.9rem;
        line-height: 1.3;
    }
    
    /* Styles pour les réseaux sociaux */
    .bg-facebook { background-color: #3b5998 !important; }
    .bg-twitter { background-color: #1da1f2 !important; }
    .bg-linkedin { background-color: #0077b5 !important; }
    .bg-instagram { background: linear-gradient(45deg, #405de6, #5851db, #833ab4, #c13584, #e1306c, #fd1d1d) !important; }
    
    .input-group-text {
        min-width: 42px;
        justify-content: center;
    }
    
    .auth-form-container {
        background-color: #fff;
        border-radius: 0;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        padding: 2rem 20%;
        margin: 0 auto;
        width: 100%;
        max-width: 1200px;
    }
    
    .form-section {
        margin-bottom: 0.75rem;
    }
    
    .section-title {
        font-size: 1rem;
        margin: 0.5rem 0;
        color: #2c3e50;
        font-weight: 600;
        padding: 0.25rem 0;
    }
    /* Style pour les champs professionnels */
    .professional-fields {
        display: none;
        background-color: #f8f9fa;
        border-radius: 0.2rem;
        padding: 0.5rem 1rem;
        margin: 0.5rem 0;
        border: 1px solid #e9ecef;
        font-size: 0.85em;
        width: 100%;
    }
    
    /* Champs de formulaire */
    .form-control, .form-select {
        padding: 0.3rem 0.5rem;
        font-size: 0.9rem;
        border-radius: 0.2rem;
        height: calc(1.5em + 0.6rem);
    }
    
    /* Style pour les groupes de champs */
    .form-group {
        margin-bottom: 1.5rem;
    }
    
    /* Style pour les labels */
    .form-label {
        font-weight: 500;
        margin-bottom: 0.5rem;
        color: #495057;
    }
    
    /* Style pour les messages d'erreur */
    .invalid-feedback {
        display: block;
        width: 100%;
        margin-top: 0.25rem;
        font-size: 0.875em;
        color: #dc3545;
    }
    
    /* Style pour les boutons radio personnalisés */
    .account-type-radio:checked + .account-type-label {
        border-color: #0d6efd;
        background-color: #e7f1ff;
    }
    
    /* Augmenter la largeur du conteneur principal */
    .auth-form {
        max-width: 900px;
        margin: 0 auto;
    }
    
    /* Espacement amélioré */
    .form-row {
        display: flex;
        flex-wrap: wrap;
        margin-right: -1rem;
        margin-left: -1rem;
        width: 100%;
    }
    
    .form-group {
        padding-right: 1rem;
        padding-left: 1rem;
        margin-bottom: 1rem;
        flex: 1 0 0%;
        min-width: 48%;
        max-width: 100%;
    }
    
    /* Taille de police des champs */
    .form-control, .form-select {
        padding: 0.7rem 1rem;
        font-size: 1rem;
    }
    
    /* Hauteur des champs */
    .form-control, .form-select {
        height: auto;
        min-height: 48px;
    }
    
    /* Icônes dans les champs */
    .input-group-text {
        min-width: 48px;
        justify-content: center;
    }
    
    .professional-fields h5 {
        color: #0d6efd;
        margin-bottom: 1.5rem;
        padding-bottom: 0.5rem;
        border-bottom: 2px solid #0d6efd;
    }
    
    /* Style pour les boutons radio de type de compte */
    .account-type-radio {
        display: none;
    }
    
    .account-type-label {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0.4rem 0.2rem;
        margin-bottom: 0.4rem;
        border: 1px solid #dee2e6;
        border-radius: 0.2rem;
        cursor: pointer;
        background-color: #fff;
        font-size: 0.85em;
    }
    
                </div>
                <div class="card-body p-5 text-center">
                    <h2 class="h5 mb-4">{% trans 'Je suis :' %}</h2>
                <div id="professionalFields" class="professional-fields mt-4 p-4 bg-light rounded border" style="display: none;">
                    <div class="alert alert-info">
                        <i class="fas fa-info-circle me-2"></i>
                        {% trans 'Remplissez ces informations pour finaliser votre inscription en tant que professionnel de l\'immobilier.' %}
                    </div>
                    
                    <h5 class="fw-bold mb-4 text-primary">
                        <i class="fas fa-building me-2"></i>
                        {% trans 'Informations de l\'entreprise' %}
                    </h5>

                    <div class="row g-3">
                <!-- Informations de l'entreprise -->
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="id_nom_entreprise" class="form-label fw-bold">
                            <i class="fas fa-building me-1"></i> Raison sociale <span class="text-danger">*</span>
                        </label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-building"></i></span>
                            {{ form.nom_entreprise|add_class:"form-control"|attr:"placeholder:Nom de l'entreprise"|attr:"data-required=true" }}
                        </div>
                        <small class="form-text text-muted">La dénomination officielle de votre entreprise</small>
                    </div>
                </div>

                <!-- SIRET et RCS -->
                <div class="col-md-6">
                    <div class="row g-2">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="id_siret" class="form-label fw-bold">
                                    <i class="fas fa-id-card me-1"></i> N° SIRET <span class="text-danger">*</span>
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-hashtag"></i></span>
                                    {{ form.siret|add_class:"form-control"|attr:"placeholder:14 chiffres"|attr:"data-required=true"|attr:"pattern:\\d{14}"|attr:"maxlength:14" }}
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="id_rcs" class="form-label fw-bold">
                                    <i class="fas fa-file-invoice me-1"></i> N° RCS <span class="text-danger">*</span>
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-file-alt"></i></span>
                                    {{ form.rcs|add_class:"form-control"|attr:"placeholder:N° RCS"|attr:"data-required=true" }}
                                </div>
                                <small class="form-text text-muted">Ex: RCS Paris 123 456 789</small>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Forme juridique et capital -->
                <div class="col-md-6">
                    <div class="row g-2">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="id_forme_juridique" class="form-label fw-bold">
                                    <i class="fas fa-balance-scale me-1"></i> Forme juridique <span class="text-danger">*</span>
                                </label>
                                <select class="form-select" id="id_forme_juridique" name="forme_juridique" required>
                                    <option value="" selected disabled>Sélectionnez...</option>
                                    <option value="SARL">SARL</option>
                                    <option value="SAS">SAS</option>
                                    <option value="SASU">SASU</option>
                                    <option value="EURL">EURL</option>
                                    <option value="EI">Entreprise Individuelle</option>
                                    <option value="EIRL">EIRL</option>
                                    <option value="SA">SA</option>
                                    <option value="SNC">SNC</option>
                                    <option value="SCP">SCP</option>
                                    <option value="Autre">Autre</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="id_capital" class="form-label fw-bold">
                                    <i class="fas fa-euro-sign me-1"></i> Capital social
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text">€</span>
                                    {{ form.capital|add_class:"form-control"|attr:"placeholder:Montant en euros"|attr:"step:0.01" }}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Numéro de TVA et horaires -->
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="id_tva_intracom" class="form-label fw-bold">
                            <i class="fas fa-file-invoice-dollar me-1"></i> N° TVA intracommunautaire <span class="text-danger">*</span>
                        </label>
                        <div class="input-group">
                            <span class="input-group-text">FR</span>
                            {{ form.tva_intracom|add_class:"form-control"|attr:"placeholder:FRXX123456789"|attr:"required"|attr:"pattern:FR[0-9A-Z]{2}[0-9]{9}" }}
                        </div>
                        <small class="form-text text-muted">Format: FR + 2 lettres + 9 chiffres</small>
                    </div>
                </div>

                <!-- Date de création et effectif -->
                <div class="col-md-6">
                    <div class="row g-2">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="id_date_creation" class="form-label fw-bold">
                                    <i class="far fa-calendar-alt me-1"></i> Date de création <span class="text-danger">*</span>
                                </label>
                                {{ form.date_creation|add_class:"form-control"|attr:"type:date"|attr:"required" }}
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="id_effectif" class="form-label fw-bold">
                                    <i class="fas fa-users me-1"></i> Effectif
                                </label>
                                <select class="form-select" id="id_effectif" name="effectif">
                                    <option value="" selected>Non précisé</option>
                                    <option value="1-2">1-2 salariés</option>
                                    <option value="3-5">3-5 salariés</option>
                                    <option value="6-9">6-9 salariés</option>
                                    <option value="10-19">10-19 salariés</option>
                                    <option value="20-49">20-49 salariés</option>
                                    <option value="50-99">50-99 salariés</option>
                                    <option value="100+">100+ salariés</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Description de l'entreprise -->
                <div class="col-12">
                    <div class="mb-3">
                        <label for="id_description" class="form-label fw-bold">
                            <i class="fas fa-align-left me-1"></i> Description de l'entreprise <span class="text-danger">*</span>
                        </label>
                        {{ form.description|add_class:"form-control"|attr:"rows:4"|attr:"placeholder:Présentez votre entreprise en quelques lignes..."|attr:"required" }}
                        <small class="form-text text-muted">Décrivez vos activités, vos valeurs et votre expérience dans l'immobilier</small>
                    </div>
                </div>

                <!-- Logo de l'entreprise -->
                <div class="col-12">
                    <div class="mb-3">
                        <label for="id_logo" class="form-label fw-bold">
                            <i class="fas fa-image me-1"></i> Logo de l'entreprise
                        </label>
                        {{ form.logo|add_class:"form-control"|attr:"type:file"|attr:"accept:image/*" }}

                    </div>
                </div>

                <!-- Réseaux sociaux -->
                <div class="col-12">
                    <div class="mb-3">
                        <label class="form-label fw-bold">
                            <i class="fas fa-share-alt me-1"></i> Réseaux sociaux
                        </label>
                        <div class="row g-2">
                            <div class="col-md-4">
                                <div class="input-group mb-2">

                                    {{ form.facebook|add_class:"form-control"|attr:"placeholder:https://facebook.com/votrepage" }}
                                </div>
                                {% if form.facebook.errors %}
                                    <div class="invalid-feedback d-block">
                                        {{ form.facebook.errors.0 }}
                                    </div>
                                {% endif %}
                            </div>
                            <div class="col-md-4">
                                <div class="input-group mb-2">
                                    <span class="input-group-text bg-linkedin text-white"><i class="fab fa-linkedin-in"></i></span>
                                    {{ form.linkedin|add_class:"form-control"|attr:"placeholder:https://linkedin.com/company/votresociete" }}
                                </div>
                                {% if form.linkedin.errors %}
                                    <div class="invalid-feedback d-block">
                                        {{ form.linkedin.errors.0 }}
                                    </div>
                                {% endif %}
                            </div>
                            <div class="col-md-4">
                                <div class="input-group mb-2">
                                    <span class="input-group-text bg-instagram text-white"><i class="fab fa-instagram"></i></span>
                                    {{ form.instagram|add_class:"form-control"|attr:"placeholder:https://instagram.com/votrecompte" }}
                                </div>
                                {% if form.instagram.errors %}
                                    <div class="invalid-feedback d-block">
                                        {{ form.instagram.errors.0 }}
                                    </div>
                                {% endif %}
                            </div>
                        </div>
                        <small class="form-text text-muted">Ces champs sont facultatifs</small>
                    </div>
                </div>

                <!-- Site web -->
                <div class="col-12">
                    <div class="mb-3">
                        <label for="id_site_web" class="form-label fw-bold">
                            <i class="fas fa-globe me-1"></i> Site web
                        </label>
                        <div class="input-group">

                            {{ form.site_web|add_class:"form-control"|attr:"placeholder:https://www.votresociete.com" }}

                            <div class="invalid-feedback d-block">
                                {{ form.site_web.errors.0 }}

                    </div>
                </div>

                <!-- Téléphone professionnel -->
                <div class="col-md-6">
                    <div class="mb-3">

                        </label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-phone"></i></span>

                        {% if form.telephone.errors %}
                            <div class="invalid-feedback d-block">
                                {{ form.telephone.errors.0 }}

    {% block extra_js %}
    <script src="{% static 'js/cleave.min.js' %}"></script>
    <script>
    // Vérification du chargement du script
    console.log('=== SCRIPT REGISTER.HTML CHARGÉ ===');
    console.log('URL de la page:', window.location.href);
    console.log('Type de compte sélectionné au chargement:', document.querySelector('input[name="user_type"]:checked').value);
    
    // Afficher tous les champs pour le débogage
    const allFields = document.querySelectorAll('input, select, textarea');
    console.log('Champs de formulaire trouvés:', allFields.length);
    
    // Fonction pour afficher/masquer les champs professionnels
    function toggleProfessionalFields(show) {
        console.log('toggleProfessionalFields appelée avec show =', show);
        
        // Afficher/masquer la section des champs professionnels
        const professionalSection = document.getElementById('professionalFields');
        if (professionalSection) {
            professionalSection.style.display = show ? 'block' : 'none';
            
            // Activer/désactiver les champs de formulaire
            const formFields = professionalSection.querySelectorAll('input, select, textarea');
            formFields.forEach(field => {
                field.disabled = !show;
                // Rendre les champs obligatoires uniquement si visibles
                if (field.hasAttribute('data-required')) {
                    field.required = show;
                }
            });
        }
        
        // Gérer les champs professionnels individuels en dehors de la section
        const professionalOnlyFields = document.querySelectorAll('.professional-only');
        professionalOnlyFields.forEach(element => {
            element.style.display = show ? 'block' : 'none';
            const fields = element.querySelectorAll('input, select, textarea');
            fields.forEach(field => {
                field.disabled = !show;
                if (field.hasAttribute('data-required')) {
                    field.required = show;
                }
            });
        });
        
        console.log('Champs professionnels', show ? 'affichés' : 'masqués');
    }
    
    // Fonction pour basculer la visibilité du mot de passe
    function setupPasswordToggles() {
        document.querySelectorAll('.toggle-password').forEach(button => {
            button.addEventListener('click', function() {
                const input = this.closest('.input-group').querySelector('input');
                const icon = this.querySelector('i');
                
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                } else {
                    input.type = 'password';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
            });
        });
    }
    
    // Fonction pour gérer le changement de type de compte
    function handleAccountTypeChange() {
        const userType = document.querySelector('input[name="user_type"]:checked').value;
        const isProfessional = userType === 'professionnel';
        toggleProfessionalFields(isProfessional);
        
        // Mettre à jour les champs requis
        const professionalRequired = document.querySelectorAll('.professional-required');
        professionalRequired.forEach(field => {
            field.required = isProfessional;
        });
    }
    
    // Fonction pour initialiser la validation des champs
    function initValidation() {
        // Validation du SIRET (14 chiffres)
        const siretInput = document.getElementById('id_siret');
        if (siretInput) {
            siretInput.addEventListener('input', function(e) {
                let value = e.target.value.replace(/\D/g, ''); // Supprime tout ce qui n'est pas un chiffre
                e.target.value = value.slice(0, 14); // Limite à 14 chiffres
            });
        }
        
        // Validation du téléphone (10 chiffres)
        const telInput = document.getElementById('id_telephone');
        if (telInput) {
            telInput.addEventListener('input', function(e) {
                let value = e.target.value.replace(/\D/g, ''); // Supprime tout ce qui n'est pas un chiffre
                e.target.value = value.slice(0, 10); // Limite à 10 chiffres
            });
        }
        
        // Validation du code postal (5 chiffres)
        const cpInput = document.getElementById('id_code_postal');
        if (cpInput) {
            cpInput.addEventListener('input', function(e) {
                let value = e.target.value.replace(/\D/g, ''); // Supprime tout ce qui n'est pas un chiffre
                e.target.value = value.slice(0, 5); // Limite à 5 chiffres
            });
        }
    }
    
    // Fonction pour afficher l'état des champs professionnels
    function logProfessionalFieldsState() {
        const professionalSections = document.querySelectorAll('.professional-fields');
        console.log('=== ÉTAT DES CHAMPS PROFESSIONNELS ===');
        console.log('Nombre de sections professionnelles:', professionalSections.length);
        professionalSections.forEach((section, index) => {
            console.log(`Section ${index + 1}:`, {
                id: section.id || 'Aucun ID',
                display: window.getComputedStyle(section).display,
                visibility: window.getComputedStyle(section).visibility,
                isConnected: section.isConnected
            });
        });
        
        const radios = document.querySelectorAll('input[name="user_type"]');
        console.log('Boutons radio trouvés:', radios.length);
        radios.forEach(radio => {
            console.log(`Bouton ${radio.value}:`, {
                checked: radio.checked,
                id: radio.id,
                isConnected: radio.isConnected
            });
        });
    }
    
    // Fonction pour gérer le changement de type de compte
    function handleAccountTypeChange() {
        const userType = document.querySelector('input[name="user_type"]:checked').value;
        const isProfessional = userType === 'professionnel';
        console.log('Changement de type de compte:', userType);
        toggleProfessionalFields(isProfessional);
    }

    // Initialisation au chargement de la page
    document.addEventListener('DOMContentLoaded', function() {
        console.log('=== INITIALISATION DU FORMULAIRE ===');
        
        // Initialiser les bascules de mot de passe
        setupPasswordToggles();
        
        // Vérifier l'état initial des boutons radio
        const professionnelRadio = document.querySelector('input[value="professionnel"]');
        const isProfessional = professionnelRadio && professionnelRadio.checked;
        toggleProfessionalFields(isProfessional);
        
        // Ajouter les écouteurs d'événements sur les boutons radio
        document.querySelectorAll('input[name="user_type"]').forEach(radio => {
            radio.addEventListener('change', handleAccountTypeChange);
        });
        
        // Initialiser la validation des champs SIRET, téléphone et code postal
        initValidation();
        
        // Initialiser le sélecteur de langues multiples
        const languesSelect = document.getElementById('langues');
        if (languesSelect) {
            // Vérifier si Choices.js est chargé
            if (typeof Choices !== 'undefined') {
                new Choices(languesSelect, {
                    removeItemButton: true,
                    searchEnabled: true,
                    placeholder: true,
                    placeholderValue: 'Sélectionnez les langues parlées',
                    searchPlaceholderValue: 'Rechercher une langue',
                    noResultsText: 'Aucun résultat',
                    itemSelectText: 'Cliquez pour sélectionner',
                    classNames: {
                        containerInner: 'choices__inner',
                        input: 'choices__input',
                    },
                });
            } else {
                console.warn('Choices.js n\'est pas chargé. Le sélecteur de langues ne sera pas optimisé.');
            }
        }
        
        // Validation du formulaire
        const form = document.querySelector('.needs-validation');
        if (form) {
            form.addEventListener('submit', function(event) {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        }
        
        console.log('Initialisation terminée');
    });
    
    });
    
    // Vérification finale de l'état des champs
    console.log('=== VÉRIFICATION FINALE ===');
    logProfessionalFieldsState();
    
    // Vérifier si les événements sont correctement attachés
    const radios = document.querySelectorAll('input[name="user_type"]');
    radios.forEach(radio => {
        const hasListener = radio.onchange !== null;
        console.log(`Bouton ${radio.value} a un écouteur:`, hasListener);
        
        // Ajouter un écouteur manuellement si nécessaire
        if (!hasListener) {
            console.log(`Ajout d'un écouteur sur le bouton ${radio.value}`);
            radio.addEventListener('change', handleAccountTypeChange);
        }
    });
    
    // Forcer l'affichage initial des champs professionnels si nécessaire
    const initialType = document.querySelector('input[name="user_type"]:checked').value;
    console.log('Type de compte initial:', initialType);
    toggleProfessionalFields(initialType === 'professionnel');
</script>
{% endblock %}
