{% extends 'immobilier/base.html' %}
{% load static %}

{% block title %}Erreur 400 - Requête incorrecte{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="error-template">
                <h1 class="display-1 text-danger">400</h1>
                <h2 class="display-4">Requête incorrecte</h2>
                <div class="error-details my-4">
                    <p>Désolé, la requête que vous avez effectuée est incorrecte.</p>
                </div>
                <div class="error-actions mt-4">
                    <a href="{% url 'immobilier:accueil' %}" class="btn btn-primary btn-lg me-2">
                        <i class="fas fa-home"></i> Page d'accueil
                    </a>
                    <a href="{% url 'immobilier:liste_biens' %}" class="btn btn-outline-primary btn-lg ms-2">
                        <i class="fas fa-search"></i> Voir nos biens
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
